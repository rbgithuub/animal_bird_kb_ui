apiVersion: apps/v1
kind: Deployment
metadata:
  name: animal-kb-celery-beat
  namespace: animal-kb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: animal-kb-celery
      component: beat
  template:
    metadata:
      labels:
        app: animal-kb-celery
        component: beat
    spec:
      containers:
      - name: celery-beat
        image: rbdockerhuub/animal-kb-celery-beat:v4.7
        imagePullPolicy: IfNotPresent
        # Replace with your beat invocation if it differs.
        command: ["celery", "-A", "celery_worker", "beat", "--loglevel=info"]
        envFrom:
        - configMapRef:
            name: animal-kb-config
        - secretRef:
            name: animal-kb-secrets
        - secretRef:
            name: redis-secret
        env:
          # Pull Redis password securely from redis-secret
          - name: REDIS_PASSWORD
            valueFrom:
              secretKeyRef:
                name: redis-secret
                key: REDIS_PASSWORD  # ensure this key exists in your redis-secret
          # Construct the Celery broker URL dynamically
          - name: CELERY_BROKER_URL
            value: "redis://:$(REDIS_PASSWORD)@redis:6379/0"
        resources:
          requests:
            cpu: "50m"
            memory: "128Mi"
