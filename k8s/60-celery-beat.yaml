apiVersion: apps/v1
kind: Deployment
metadata:
  name: animal-kb-celery-beat
  namespace: animal-kb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: animal-kb-celery
      component: beat
  template:
    metadata:
      labels:
        app: animal-kb-celery
        component: beat
    spec:
      containers:
      - name: celery-beat
        image: rbdockerhuub/animal-kb-beat:v3.9
        imagePullPolicy: IfNotPresent
        # Replace with your beat invocation if it differs.
        command: ["celery", "-A", "celery_worker", "beat", "--loglevel=info"]
        envFrom:
        - configMapRef:
            name: animal-kb-config
        - secretRef:
            name: animal-kb-secrets
        - secretRef:
            name: redis-secret
        resources:
          requests:
            cpu: "50m"
            memory: "128Mi"
