---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: animal-kb-api
  namespace: animal-kb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: animal-kb-api
  template:
    metadata:
      labels:
        app: animal-kb-api
    spec:
      containers:
      - name: api
        image: rbdockerhuub/animal-kb-api:v3.9
        ports:
        - containerPort: 5000  # change if your container listens on a different port
        envFrom:
        - configMapRef:
            name: animal-kb-config
        - secretRef:
            name: animal-kb-secrets
        - secretRef:
            name: mongodb-secret
        - secretRef:
            name: redis-secret
        # Readiness / liveness probes (adjust path/port if needed)
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 8
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 20

---
apiVersion: v1
kind: Service
metadata:
  name: animal-kb-api
  namespace: animal-kb
spec:
  selector:
    app: animal-kb-api
  ports:
  - port: 80
    targetPort: 5000
  type: ClusterIP
   