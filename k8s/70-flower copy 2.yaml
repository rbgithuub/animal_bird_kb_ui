apiVersion: apps/v1
kind: Deployment
metadata:
  name: animal-kb-celery-flower
  namespace: animal-kb
  labels:
    app: animal-kb-celery
    component: flower
spec:
  replicas: 1
  selector:
    matchLabels:
      app: animal-kb-celery
      component: flower
  template:
    metadata:
      labels:
        app: animal-kb-celery
        component: flower
    spec:
      containers:
        - name: celery-flower
          image: rbdockerhuub/animal-kb-celery-flower:v7.0
          command: ["python", "-m", "flower"]
          args:
            - "--broker=redis://:$(REDIS_PASSWORD)@redis:6379/0"
            - "--address=0.0.0.0"
            - "--port=5555"
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: redis-password
          ports:
            - containerPort: 5555
---
apiVersion: v1
kind: Service
metadata:
  name: animal-kb-celery-flower
  namespace: animal-kb
spec:
  selector:
    app: animal-kb-celery
    component: flower
  ports:
    - port: 5555
      targetPort: 5555
  type: ClusterIP
