# Redis password secret
apiVersion: v1
kind: Secret
metadata:
  name: redis-secret
  namespace: animal-kb
type: Opaque
stringData:
  REDIS_PASSWORD: change_me_redis_password

---
# PVC for Redis persistence (optional but helpful)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-pvc
  namespace: animal-kb
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---
# Redis Deployment (Bitnami image - accepts REDIS_PASSWORD)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: animal-kb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: bitnami/redis:6.2.14
        imagePullPolicy: IfNotPresent
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-secret
              key: REDIS_PASSWORD
        - name: ALLOW_EMPTY_PASSWORD
          value: "no"
        ports:
        - containerPort: 6379
        volumeMounts:
        - name: redis-data
          mountPath: /data
      volumes:
      - name: redis-data
        persistentVolumeClaim:
          claimName: redis-pvc

---
# Redis Service
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: animal-kb
spec:
  selector:
    app: redis
  ports:
  - port: 6379
    targetPort: 6379
  type: ClusterIP
