apiVersion: apps/v1
kind: Deployment
metadata:
  name: animal-kb-celery-worker
  namespace: animal-kb
  labels:
    app: animal-kb-celery
    component: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: animal-kb-celery
      component: worker
  template:
    metadata:
      labels:
        app: animal-kb-celery
        component: worker
    spec:
      containers:
      - name: celery-worker
        image: rbdockerhuub/animal-kb-celery-worker:v4.7
        imagePullPolicy: IfNotPresent
        command: ["celery", "-A", "celery_worker", "worker", "--loglevel=info", "--concurrency=2"]
        envFrom:
          - configMapRef:
              name: animal-kb-config
          - secretRef:
              name: animal-kb-secrets
          - secretRef:
              name: mongodb-secret
          - secretRef:
              name: redis-secret
        env:
          # Pull Redis password securely from redis-secret
          - name: REDIS_PASSWORD
            valueFrom:
              secretKeyRef:
                name: redis-secret
                key: REDIS_PASSWORD  # ensure this key exists in your redis-secret
          # Construct the Celery broker URL dynamically
          - name: CELERY_BROKER_URL
            value: "redis://:$(REDIS_PASSWORD)@redis:6379/0"
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      restartPolicy: Always
      dnsPolicy: ClusterFirst
      terminationGracePeriodSeconds: 30
