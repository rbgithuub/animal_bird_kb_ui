version: '3.9'

services:

  # MongoDB
  mongo:
    image: mongo:6
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  # Redis for Celery broker
  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"

  # Flask API
  api:
    build: .
    container_name: flask-api
    ports:
      - "5001:5000"
    environment:
      - FLASK_APP=app.py
      - FLASK_ENV=development
      - MONGO_URI=mongodb://mongo:27017/
    depends_on:
      - mongo
      - redis
    command: flask run --host=0.0.0.0 --port=5000

  # Celery Worker
  worker:
    build: .
    container_name: celery-worker
    depends_on:
      - redis
      - mongo
    environment:
      - MONGO_URI=mongodb://mongo:27017/
    command: celery -A celery_worker worker --loglevel=info

  # Celery Beat Scheduler
  beat:
    build: .
    container_name: celery-beat
    depends_on:
      - redis
      - mongo
    environment:
      - MONGO_URI=mongodb://mongo:27017/
      - CELERY_BROKER_URL=redis://redis:6379/0
    command: celery -A celery_worker beat --loglevel=info

  # Flower UI for Celery monitoring (optional)
  flower:
    image: mher/flower
    container_name: flower
    ports:
      - "5555:5555"
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      - redis

volumes:
  mongo-data:
