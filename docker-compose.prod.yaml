services:
  api:
    ports:
      - "5003:5000"
    env_file:
      - .env.prod
    command: flask run --reload

  mongo:
    ports:
      - "27019:27017"
    env_file:
      - .env.dev
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}


  redis:
    ports:
      - "6381:6379"

  flower:
    image: mher/flower
    ports:
      - "5555:5555"
    env_file:
      - .env.prod
    command: celery --broker=${CELERY_BROKER_URL} flower --port=5555
    depends_on:
      - redis